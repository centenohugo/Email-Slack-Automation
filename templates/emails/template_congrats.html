<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 24px; font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; background: #ffffff; }
  .container { max-width: 680px; margin: 0 auto; }
  p { font-size: 14px; color: #333; line-height: 1.65; margin: 0 0 14px 0; }
</style>
</head>
<body style="margin:0; padding:24px; font-family:Arial, Helvetica, sans-serif; color:#1a1a1a; background:#ffffff;">
<div class="container">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td align="center">
<table role="presentation" width="680" cellpadding="0" cellspacing="0" border="0" style="width:680px; max-width:680px;">

  <tr><td>
    <p style="font-size:14px; color:#333; line-height:1.65; margin:0 0 14px 0;">Hola {{ srmet_name.split(',')[1].strip() if ',' in srmet_name else srmet_name }},</p>
    <p style="font-size:14px; color:#333; line-height:1.65; margin:0 0 14px 0;">¡Enhorabuena! 🎉 Tu equipo no tiene ningún curso de Safety Training pendiente en los próximos {{ days_threshold }} días. Sois un referente en compliance — ¡seguid así! 💪</p>
    <p style="font-size:13px; color:#444; line-height:1.65; margin:0;">
      Muchas gracias,<br>
      Un saludo,<br>
      <strong>{{ signature }}</strong>
    </p>
  </td></tr>

</table>
</td></tr></table>
</div>
</body>
</html>
